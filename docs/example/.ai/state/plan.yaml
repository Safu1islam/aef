# EXAMPLE DATA — a fictional project, for documentation and screenshots.
#
# "Meridian" is not real. No such product, team or repository exists. This file
# exists so anyone can run the dashboard and see what a populated plan looks
# like before they have a project of their own:
#
#     python aef/tools/aef.py --root aef/docs/example dashboard
#
# It also serves as a worked example of a well-formed plan: a tree with real
# depth, every status represented, agents assigned, and an honest
# known_omissions entry.

meta:
  plan_version: 3
  schema_version: 1
  project: Meridian
  aef_version: 0.4.2
  planned_at: 2026-05-04
  planned_by_role: analyst
  mode: standard

  completeness:
    declared_complete: true
    basis: >
      Planned end to end before implementation, per Constitution 4a. Every
      section a shipping invoicing product needs is represented, including the
      operational work that is usually discovered late — backups, rate limits
      and the dunning flow.
    known_omissions:
      - >
        Multi-currency is deliberately unplanned. The pricing model is not
        settled, and planning against an unsettled model produces tasks that
        get rewritten. Named here rather than left silent — an unnamed gap
        reads as "nothing to do".
      - >
        SOC 2 evidence collection is a business process, not an agent task, so
        it is not a node. It remains open in the completion report.

tree:
