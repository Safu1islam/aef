  - id: T-021
    title: Payment provider integration
    change_class: money_or_payments
    mode: critical
    status: blocked
    blocked_reason: >
      NEEDS_HUMAN — the provider's live keys require a signed commercial
      agreement, and the sandbox does not reproduce the 3DS challenge path this
      task exists to handle. Escalated rather than stubbed: a fabricated pass
      here would be a payment bug found in production.
    depends_on: [T-020]
    owned_paths: [src/billing/provider.py]
    acceptance_criteria:
      - id: AC-1
        statement: "A declined card surfaces the provider's reason without exposing the raw response."
        result: NOT_RUN
        evidence: "blocked on credentials"

  - id: T-022
    title: Webhook handling, idempotent
    change_class: money_or_payments
    mode: critical
    status: failed
    blocked_reason: >
      Implemented and rejected at review. Two BLOCKING findings: the handler
      deduplicated on the provider's event id but processed before recording it,
      so a retry inside the window double-credited; and signature verification
      compared with == rather than a constant-time compare. Reverted rather than
      patched — the ordering defect is a design error, not a bug.
    depends_on: [T-020]
    owned_paths: [src/billing/webhook.py]
    acceptance_criteria:
      - id: AC-1
        statement: "The same webhook delivered twice credits the account once."
        result: FAILED
        evidence: "tests/test_webhook.py::test_duplicate_delivery — executed, observed FAIL"

  - id: T-023
    title: Dunning and retry schedule
    change_class: money_or_payments
    mode: critical
    status: ready
    depends_on: [T-021, T-022]
    owned_paths: [src/billing/dunning.py]
    acceptance_criteria:
      - id: AC-1
        statement: "A failed charge retries on the documented schedule and stops after the final attempt."
        result: NOT_RUN
        evidence: "not started — depends on T-021 and T-022"

