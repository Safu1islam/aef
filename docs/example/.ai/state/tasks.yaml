# EXAMPLE DATA — fictional. See plan.yaml for what this is and why.
#
# Every status in the vocabulary appears at least once, deliberately: complete,
# claimed and in_review (both display as In progress), blocked, failed, and
# ready with an unmet dependency (which displays as Waiting for dependency).
# A dashboard is only trustworthy if you have seen it show bad news.

tasks:

  - id: T-001
    title: Service skeleton and configuration
    change_class: new_project
    status: complete
    owned_paths: [src/config/**]
    acceptance_criteria:
      - id: AC-1
        statement: "Loading config with no file present yields documented defaults and does not raise."
        result: PASSED
        evidence: "tests/test_config.py::test_defaults — executed, observed pass"

  - id: T-002
    title: Postgres schema and migration runner
    change_class: data_model_change
    status: complete
    depends_on: [T-001]
    owned_paths: [src/db/**, migrations/**]
    acceptance_criteria:
      - id: AC-1
        statement: "A fresh database applies every migration and reports the expected schema version."
        result: PASSED
        evidence: "tests/test_migrations.py — executed, observed pass"
      - id: AC-2
        statement: "Every migration has a down path that restores the previous schema."
        result: PASSED
        evidence: "tests/test_migrations.py::test_down — executed, observed pass"

