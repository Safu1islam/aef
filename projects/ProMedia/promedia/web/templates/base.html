<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ProMedia{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --fg:#1a1a1a; --bg:#fff; --muted:#666;
          --line:#d8d8d8; --ok:#0a7a34; --warn:#8a5a00; --bad:#b00020; --panel:#f7f7f7; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8e8; --bg:#161616; --muted:#a0a0a0; --line:#333;
            --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --panel:#1f1f1f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:1.5rem; font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;
         color:var(--fg); background:var(--bg); max-width:70rem; margin-inline:auto; }
  a { color:inherit; }
  h1,h2,h3 { line-height:1.2; }
  nav { display:flex; gap:1rem; padding-bottom:1rem; border-bottom:1px solid var(--line); margin-bottom:1.5rem; }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  code, .mono { font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.875em; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:1rem; margin-bottom:1rem; }
  .verdict { font-weight:700; }
  .PERMITTED { color:var(--ok); } .BLOCKED { color:var(--bad); } .ESCALATE { color:var(--warn); }
  .banner { border-left:4px solid var(--warn); background:var(--panel); padding:.75rem 1rem; margin-bottom:1rem; }
  .banner.bad { border-left-color:var(--bad); }
  button { font:inherit; padding:.5rem 1rem; border:1px solid var(--line); border-radius:6px;
           background:var(--panel); color:inherit; cursor:pointer; }
  button:focus-visible, a:focus-visible { outline:3px solid #4a90d9; outline-offset:2px; }
  button[disabled] { opacity:.5; cursor:not-allowed; }
  .muted { color:var(--muted); }
  .field { margin:1.1rem 0; max-width:44rem; }
  .field label { display:block; margin-bottom:.25rem; }
  .field .req { color:var(--bad); font-size:.8rem; }
  .field .hint { margin:.15rem 0 .4rem; font-size:.85rem; }
  input[type=text], input[type=password], input[type=number], textarea {
    font:inherit; width:100%; padding:.45rem .55rem; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:inherit; }
  input[type=checkbox] { width:1.1rem; height:1.1rem; }
  input:focus-visible, textarea:focus-visible { outline:3px solid #4a90d9; outline-offset:1px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; }
  dl.kv { display:grid; grid-template-columns:max-content 1fr; gap:.35rem 1rem; margin:0; }
  dl.kv dt { color:var(--muted); font-size:.85rem; }
  dl.kv dd { margin:0; }
  .wrap { overflow-x:auto; }
  /* Media workspace (T-049). Added to the existing system rather than beside
     it, so the workspace and the approval surface stay one interface. */
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));
          gap:.75rem; margin-bottom:1rem; }
  .grid .panel { margin-bottom:0; }
  .big { font-size:1.6rem; font-weight:600; margin:.2rem 0 0; line-height:1.1; }
  .row { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; margin:1rem 0; }
  select { font:inherit; padding:.45rem .55rem; border:1px solid var(--line);
           border-radius:6px; background:var(--bg); color:inherit; }
  video { display:block; width:100%; max-width:44rem; background:#000; border-radius:8px; }
  tr.current td { background:var(--panel); }
</style>
</head>
<body>
<nav>
  <a href="/">Dashboard</a>
  <a href="/projects">Projects</a>
  <a href="/media">Media</a>
  <a href="/posts">Posts</a>
  <a href="/publications">Publications</a>
  <a href="/settings">Settings</a>
  <a href="/ops">Capabilities</a>
</nav>
{% block body %}{% endblock %}
</body>
</html>
